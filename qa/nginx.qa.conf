server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    # S3 presigned POST targets the bucket without a trailing slash. Avoid
    # nginx auto-redirects, which change POST to GET and drop the public port.
    location = /qa-uploads {
        proxy_pass http://qa-s3:4566;
        proxy_set_header Host $http_host;
    }

    location /qa-uploads/ {
        proxy_pass http://qa-s3:4566;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://qa-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 45s;
    }
    location /auth/ {
        proxy_pass http://qa-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location /static/ {
        proxy_pass http://qa-api:8000;
    }
    location / {
        proxy_pass http://qa-web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
}
