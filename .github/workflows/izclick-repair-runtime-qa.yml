name: IZ-Click immutable repair runtime verification
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the already-tested candidate without rebuilding or deploying
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/paolobp82/izclick-api@sha256:50919c1c42ffcb3e289b6fec1b5617e9745894bdf73bcb5ca8e84b7d173c8df0
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = '8d64f2f1fb50fc3691c79427c9cd93d6c3d75d41'
          docker run -i --rm --network none --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=plane.settings.production \
            -e SECRET_KEY=isolated-runtime-image-check-not-a-production-secret \
            -e REDIS_URL=redis://127.0.0.1:1/0 \
            -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/unused \
            "$IMAGE" - < ops/izclick-image-route-check.py
