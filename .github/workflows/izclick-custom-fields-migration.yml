name: IZ-Click custom fields migration artifact
on:
  push:
    branches: [izclick/clickup-native-list-detail-20261014]
    paths:
      - 'apps/api/plane/db/models/izclick_custom_field.py'
      - 'apps/api/plane/db/models/__init__.py'
      - 'apps/api/plane/api/views/izclick_custom_fields.py'
      - 'apps/api/plane/api/tests/test_izclick_custom_field_validation.py'
      - '.github/workflows/izclick-custom-fields-migration.yml'
  pull_request:
    paths:
      - "apps/api/plane/db/models/**"
      - "apps/api/plane/api/views/izclick_custom_fields.py"
      - ".github/workflows/izclick-custom-fields-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/production.txt
      - name: Generate migration WITHOUT database access
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: migration-preflight-not-for-production
        run: |
          python manage.py makemigrations db --check --dry-run --noinput
          python manage.py migrate db --plan
          test -f plane/db/migrations/0124_izclick_custom_fields.py
      - name: Upload migration for inspection; do not apply it
        uses: actions/upload-artifact@v4
        with:
          name: izclick-custom-field-migration
          path: apps/api/plane/db/migrations/*izclick_custom_fields.py
          if-no-files-found: error
