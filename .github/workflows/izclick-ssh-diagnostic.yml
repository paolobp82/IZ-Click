name: IZ-Click SSH connection diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required secrets
        env:
          SSH_KEY: ${{ secrets.IZCLICK_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.IZCLICK_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::Missing IZCLICK_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::Missing IZCLICK_SSH_KNOWN_HOSTS"; exit 1; }
      - name: Connect with pinned host identity
        env:
          SSH_KEY: ${{ secrets.IZCLICK_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.IZCLICK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=12 \
            izango@209.145.60.238 izclick-connection-check
          rm -f "$RUNNER_TEMP/ssh/id_ed25519"
