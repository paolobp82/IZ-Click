name: IZ-Click API Docker validation

on:
  push:
    branches:
      - 'izclick/produccion-v1'
      - 'izclick/nativo-clickup-v2-20261014'
    paths:
      - 'apps/api/**'
      - '.github/workflows/izclick-api-check.yml'
  workflow_dispatch:

concurrency:
  group: izclick-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compile customized Plane API image without deployment
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.api
          platforms: linux/amd64
          push: false
          tags: izclick-production:api-validation
