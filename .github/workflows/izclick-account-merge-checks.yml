name: IZCLICK account consolidation checks
on:
  push:
    branches: [ops/izclick-merge-angelica-20261030]
  pull_request:
    paths:
      - ops/izclick-merge-angelica.py
      - apps/api/plane/api/tests/test_izclick_account_merge.py
      - .github/workflows/izclick-account-merge-checks.yml
permissions:
  contents: read
concurrency:
  group: izclick-account-merge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transactional-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: izclick_test
          POSTGRES_PASSWORD: izclick_test
          POSTGRES_DB: izclick_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U izclick_test -d izclick_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://izclick_test:izclick_test@127.0.0.1:5432/izclick_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: account-merge-ephemeral-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: apps/api
        run: pip install -r requirements/production.txt
      - run: python3 -m py_compile ops/izclick-merge-angelica.py apps/api/plane/api/tests/test_izclick_account_merge.py
      - run: python3 -m unittest discover -s ops/tests -p test_account_merge_host.py -v
      - working-directory: apps/api
        run: python manage.py test plane.api.tests.test_izclick_account_merge --noinput -v 2
