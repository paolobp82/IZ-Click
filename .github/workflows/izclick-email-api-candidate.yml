name: IZ-Click email API candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: izclick-repair-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/izclick/repair-production-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: plane
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plane -d plane"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://plane:isolated-test-only@localhost:5432/plane
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: isolated-izclick-repair-ci-only-not-production
      DJANGO_SETTINGS_MODULE: plane.settings.test
      DEBUG: '0'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.21'
          python-version: '3.12'
      - name: Install exact locked test dependencies
        run: uv sync --locked
      - name: Check restored migration compatibility
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py makemigrations --check --dry-run
      - name: Run isolated catalogue and custom-field regression tests
        run: >-
          uv run pytest --migrations
          plane/tests/contract/app/test_izclick_production_statuses.py
          plane/api/tests/test_izclick_custom_field_endpoints.py
          plane/api/tests/test_izclick_custom_field_schema.py
          plane/api/tests/test_izclick_custom_field_validation.py
      - name: Preserve email behavior and metadata contracts
        run: |
          uv run python -m unittest discover -s izclick_contract_tests -v
          uv run python -m unittest discover -s plane/tests/unit/bgtasks -p test_izclick_email_pipeline.py -v
          uv run python -m unittest discover -s ../../ops/tests -v
  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin and verify the current production base image
        id: base
        run: |
          set -euo pipefail
          BASE=ghcr.io/paolobp82/izclick-api:email-candidate-b515616cf8e8b453a13b0edb8f79a0b01d5fbfd6
          docker pull "$BASE"
          PINNED=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE")
          test "$PINNED" = 'ghcr.io/paolobp82/izclick-api@sha256:31e7edf9ad2185ff91a27d01514cf444af697b6d9f156493ed1adacf0a97efbf'
          echo "image=$PINNED" >> "$GITHUB_OUTPUT"
      - name: Build and publish repaired API only; never deploy
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.repair
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/paolobp82/izclick-api:repair-${{ github.sha }}
          provenance: false
      - name: Record immutable candidate identity
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          echo "API=ghcr.io/paolobp82/izclick-api@$CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source=$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo 'No production services or databases were accessed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify routes inside the built production image without network access
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/paolobp82/izclick-api@$CANDIDATE_DIGEST"
          docker pull "$IMAGE"
          docker run --rm --network none --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=plane.settings.production \
            -e SECRET_KEY=isolated-runtime-image-check-not-a-production-secret \
            "$IMAGE" -c '
          import os, time
          started = time.perf_counter()
          import django
          django.setup()
          from django.urls import resolve
          from plane.db.models import IzClickProductionStatus, IzclickCustomField
          from plane.app.views.workspace.izclick_production_status import serialize_status
          root = "/api/workspaces/check/projects/00000000-0000-0000-0000-000000000001/"
          assert resolve("/api/workspaces/check/izclick-production-statuses/").url_name == "izclick-production-statuses"
          assert resolve(root + "izclick-custom-fields/").url_name == "izclick-custom-fields"
          assert resolve(root + "production-event-dates/").url_name == "izclick-production-event-dates"
          assert resolve(root + "production-sig-links/").url_name == "izclick-production-sig-links"
          assert callable(serialize_status)
          from pathlib import Path
          assert list(Path("/code/plane/app/views/workspace/__pycache__").glob("izclick_production_status.*.pyc"))
          print("BUILT_IMAGE_ROUTES_AND_BYTECODE_OK", round(time.perf_counter() - started, 3))
          '
