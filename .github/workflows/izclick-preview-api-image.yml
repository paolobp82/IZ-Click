name: IZ-Click preview API image
# Builds immutable backend candidates; never deploys to Contabo.
on:
  push:
    branches:
      - izclick/clickup-native-list-detail-20261014
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/izclick-preview-api-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: izclick-preview-api
  cancel-in-progress: true

jobs:
  publish-preview-api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable API candidate; no production deployment
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/izclick-api:preview-clickup-${{ github.sha }}
          provenance: false
