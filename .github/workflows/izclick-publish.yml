name: IZ-Click publish customized UI
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile.web
          - app: admin
            dockerfile: apps/admin/Dockerfile.admin
    steps:
      - name: Checkout customized v1.4.2 branch
        uses: actions/checkout@v4
        with:
          ref: izclick/v1.4.2-custom
          persist-credentials: false
      - name: Record exact source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/paolobp82/izclick-${{ matrix.app }}:v1.4.2-${{ steps.revision.outputs.sha }}
          provenance: false
