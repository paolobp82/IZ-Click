name: IZCLICK operational sprint checks
on:
  pull_request:
    branches: [izclick/clickup-native-list-detail-20261014, sprint/izclick-1-operacion-20261023, release/izclick-estados-unico-20261027]
permissions:
  contents: read
concurrency:
  group: izclick-sprint1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test apps/web/app/lib/izclick/*.test.ts
      - run: python3 -m unittest discover -s apps/api/izclick_contract_tests -p 'test_*.py' -v
  event-date-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: izclick_test
          POSTGRES_PASSWORD: izclick_test
          POSTGRES_DB: izclick_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U izclick_test -d izclick_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://izclick_test:izclick_test@127.0.0.1:5432/izclick_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: sprint1-ephemeral-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: apps/api
        run: pip install -r requirements/production.txt
      - working-directory: apps/api
        run: python manage.py test plane.api.tests.test_izclick_event_date plane.api.tests.test_izclick_sprints234 plane.api.tests.test_izclick_custom_field_validation plane.api.tests.test_izclick_custom_field_schema plane.api.tests.test_izclick_custom_field_endpoints --noinput
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and check types, without publishing or deploying
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/amd64
          push: false
          build-args: IZCLICK_VALIDATE_TYPES=true
  attachment-component:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --prefix "$RUNNER_TEMP/izclick-qa-deps" --no-save jsdom@26.1.0 esbuild@0.28.1
      - run: node qa/sprint1-attachments-dom.mjs
        env:
          IZCLICK_QA_DEPS: ${{ runner.temp }}/izclick-qa-deps
      - run: node qa/states-management-dom.mjs
        env:
          IZCLICK_QA_DEPS: ${{ runner.temp }}/izclick-qa-deps

  publish-state-fixes:
    name: Publish verified state fixes (API and Web)
    needs: [logic, event-date-persistence, web-build, attachment-component]
    if: github.head_ref == 'fix/izclick-checkbox-completado-20261027' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API preserving the deployed baseline
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.api-states-fix
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/izclick-api:states-fix-${{ github.event.pull_request.head.sha }}
          labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
      - name: Publish verified Web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: IZCLICK_VALIDATE_TYPES=true
          tags: ghcr.io/${{ github.repository_owner }}/izclick-web:states-fix-${{ github.event.pull_request.head.sha }}
          labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
      - name: Save immutable publication manifest
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          values = {name: os.environ[name] for name in ['SOURCE_SHA', 'API_DIGEST', 'WEB_DIGEST']}
          assert re.fullmatch('[0-9a-f]{40}', values['SOURCE_SHA'])
          assert all(re.fullmatch('sha256:[0-9a-f]{64}', values[key]) for key in ['API_DIGEST', 'WEB_DIGEST'])
          Path('release-manifest.json').write_text(json.dumps(values, indent=2))
          print(json.dumps(values))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: izclick-state-fixes-release-manifest
          path: release-manifest.json
          retention-days: 30
