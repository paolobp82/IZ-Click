name: IZ-Click Docker build validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile.web
          - app: admin
            dockerfile: apps/admin/Dockerfile.admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build UI image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: izclick-${{ matrix.app }}:verify
