name: IZ-Click Pilot Images - one-time publication

on:
  push:
    branches:
      - 'izclick/produccion-v1'
    paths:
      - '.github/workflows/izclick-pilot-once.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish-pilot-images:
    if: github.ref == 'refs/heads/izclick/produccion-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            context: .
            dockerfile: apps/web/Dockerfile.web
          - app: api
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable candidate image - NEVER deploy
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/izclick-${{ matrix.app }}:production-v1-${{ github.sha }}
          provenance: false
