name: IZCLICK release tooling
on:
  pull_request:
    paths:
      - 'ops/izclick-sprint1-release.py'
      - 'ops/tests/test_sprint1_release.py'
      - 'ops/izclick-sprints234-release.py'
      - 'ops/tests/test_sprints234_release.py'
      - 'ops/izclick-estados-release.py'
      - 'ops/tests/test_estados_release.py'
      - '.github/workflows/izclick-sprint1-release-checks.yml'
permissions:
  contents: read
jobs:
  release-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release safeguards without production access
        run: |
          python3 -m py_compile ops/izclick-sprint1-release.py
          python3 -m unittest discover -s ops/tests -p test_sprint1_release.py -v

          python3 -m py_compile ops/izclick-sprints234-release.py
          python3 -m unittest discover -s ops/tests -p test_sprints234_release.py -v

          python3 -m py_compile ops/izclick-estados-release.py
          python3 -m unittest discover -s ops/tests -p test_estados_release.py -v
