name: IZ-Click UX Pilot Web - one-time publication

on:
  push:
    branches:
      - 'izclick/ajustes-ux-es-20261014'
    paths:
      - '.github/workflows/izclick-ux-pilot-once.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish-ux-web:
    if: github.ref == 'refs/heads/izclick/ajustes-ux-es-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable Web candidate without deployment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/izclick-web:ux-v1-${{ github.sha }}
          provenance: false
