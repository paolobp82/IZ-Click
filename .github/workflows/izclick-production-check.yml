name: IZ-Click Production validation

on:
  pull_request:
    branches:
      - 'izclick/v1.4.2-custom'
    paths:
      - 'apps/web/**'
      - '.github/workflows/izclick-production-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute Production unit tests
        run: node --experimental-strip-types --test apps/web/app/lib/izclick/*.test.ts

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate web build, do not publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/amd64
          push: false
          tags: izclick-production:web-check
