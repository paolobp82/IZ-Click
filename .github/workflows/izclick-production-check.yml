name: IZ-Click Produccion build and metrics tests

on:
  pull_request:
    branches:
      - 'izclick/v1.4.2-custom'
      - 'izclick/flujo-nativo-sin-duplicados-20261014'
  push:
    branches:
      - 'izclick/produccion-v1'
      - 'izclick/ajustes-ux-es-20261014'
      - 'izclick/nativo-clickup-v2-20261014'
      - 'izclick/flujo-nativo-sin-duplicados-20261014'
      - 'izclick/clickup-native-list-detail-20261014'
    paths:
      - 'apps/web/**'
      - 'docs/izclick/**'
      - 'packages/i18n/**'
      - 'apps/api/plane/db/**'
      - 'apps/api/plane/utils/**'
      - 'apps/api/izclick_contract_tests/**'
      - 'apps/api/plane/app/views/**'
      - 'apps/api/plane/app/urls/**'
      - 'apps/api/plane/api/views/izclick_custom_fields.py'
      - 'apps/api/plane/api/tests/test_izclick_custom_field_endpoints.py'
      - 'apps/api/plane/api/urls/project.py'
      - '.github/workflows/izclick-production-check.yml'
  workflow_dispatch:

concurrency:
  group: izclick-production-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metrics engine
        run: node --experimental-strip-types --test apps/web/app/lib/izclick/*.test.ts
      - name: Verify all test files discovered
        run: find apps/web/app/lib/izclick -name '*.test.ts' -print

  backend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Django module syntax without changing database
        run: |
          python3 -m py_compile apps/api/plane/app/views/issue/base.py
          python3 -m py_compile apps/api/plane/app/views/__init__.py
          python3 -m py_compile apps/api/plane/app/urls/issue.py
          python3 -m py_compile apps/api/plane/utils/izclick_production.py
          python3 -m py_compile apps/api/plane/utils/izclick_workflow.py
          python3 -m py_compile apps/api/plane/db/models/izclick_production_status.py
          python3 -m py_compile apps/api/plane/db/migrations/0123_izclick_production_workspace_statuses.py
          python3 -m py_compile apps/api/plane/app/views/workspace/izclick_production_status.py
          python3 -m py_compile apps/api/plane/app/views/project/base.py
          python3 -m py_compile apps/api/plane/app/urls/workspace.py
          python3 -m py_compile apps/api/plane/api/views/izclick_custom_fields.py
          python3 -m py_compile apps/api/plane/app/urls/project.py
          python3 -m py_compile apps/api/plane/api/tests/test_izclick_custom_field_endpoints.py
      - name: Execute API metadata contract tests
        run: python3 -m unittest discover -s apps/api/izclick_contract_tests -p 'test_*.py' -v

  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compile backend image; do not publish or deploy
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.api
          platforms: linux/amd64
          push: false
          tags: izclick-production:api-test

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compile web image without deploying
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/amd64
          push: false
          tags: izclick-production:web-test
          build-args: |
            IZCLICK_VALIDATE_TYPES=true

  publish-preview-web:
    name: Publish preview web image (no deployment)
    needs: [production-metrics, backend-syntax, web-build, api-build]
    if: github.event_name == 'pull_request' && github.head_ref == 'izclick/clickup-native-list-detail-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable preview image without deployment
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            IZCLICK_VALIDATE_TYPES=true
          tags: ghcr.io/${{ github.repository_owner }}/izclick-web:preview-clickup-${{ github.event.pull_request.head.sha }}
          provenance: false
