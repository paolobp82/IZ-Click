name: IZ-Click Produccion build and metrics tests

on:
  pull_request:
    branches:
      - 'izclick/v1.4.2-custom'
  push:
    branches:
      - 'izclick/produccion-v1'
      - 'izclick/ajustes-ux-es-20261014'
      - 'izclick/nativo-clickup-v2-20261014'
    paths:
      - 'apps/web/**'
      - 'packages/i18n/**'
      - 'apps/api/plane/app/views/**'
      - 'apps/api/plane/app/urls/**'
      - '.github/workflows/izclick-production-check.yml'
  workflow_dispatch:

concurrency:
  group: izclick-production-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metrics engine
        run: node --experimental-strip-types --test apps/web/app/lib/izclick/*.test.ts
      - name: Verify all test files discovered
        run: find apps/web/app/lib/izclick -name '*.test.ts' -print

  backend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Django module syntax without changing database
        run: |
          python3 -m py_compile apps/api/plane/app/views/issue/base.py
          python3 -m py_compile apps/api/plane/app/views/__init__.py
          python3 -m py_compile apps/api/plane/app/urls/issue.py
          python3 -m py_compile apps/api/plane/utils/izclick_production.py
      - name: Execute API metadata contract tests
        run: python3 -m unittest discover -s apps/api/izclick_contract_tests -p 'test_*.py' -v

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compile web image without deploying
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          platforms: linux/amd64
          push: false
          tags: izclick-production:web-test
          build-args: |
            IZCLICK_VALIDATE_TYPES=true
