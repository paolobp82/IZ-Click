name: IZ-Click safe read-only diagnostics
on:
  workflow_dispatch:
    inputs:
      diagnostic_command:
        description: Installed read-only diagnostic
        type: choice
        options:
          - izclick-diagnostics
          - izclick-latency-v2
        default: izclick-diagnostics
permissions:
  contents: read
concurrency:
  group: izclick-readonly-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v4
      - name: Run read-only commands through preconfigured SSH
        env:
          SSH_HOST: ${{ vars.IZCLICK_SSH_HOST || '209.145.60.238' }}
          SSH_USER: ${{ vars.IZCLICK_SSH_USER || 'izango' }}
          SSH_PRIVATE_KEY: ${{ secrets.IZCLICK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.IZCLICK_SSH_KNOWN_HOSTS }}
          DIAGNOSTIC_COMMAND: ${{ inputs.diagnostic_command || 'izclick-diagnostics' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$DIAGNOSTIC_COMMAND" in
            izclick-diagnostics|izclick-latency-v2) ;;
            *) echo '::error::Unsupported diagnostic command'; exit 1 ;;
          esac
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Required SSH connection setting $v is not configured; no remote commands executed"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_izclick
          chmod 600 ~/.ssh/id_izclick
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_izclick -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "$SSH_USER@$SSH_HOST" "$DIAGNOSTIC_COMMAND"
